name: 'TrustModel Review (TR)'
description: 'Gate AI-related pull requests with TrustModel trust scoring. Detects AI code changes, posts trust metrics as PR comments and commit statuses, and surfaces website TrustScores.'
author: 'pdxlab'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  api_key:
    description: 'TrustModel API key (get one at trustmodel.ai/developers).'
    required: false
    default: ''
  github_token:
    description: 'Used only by this Action to publish PR comments and commit statuses; never uploaded to TrustModel.'
    required: false
    default: ${{ github.token }}
  threshold:
    description: 'Requested future evaluator threshold (1-100); server minimum applies.'
    required: false
    default: ''
  mode:
    description: 'advisory (default) posts the score without blocking the merge; enforce makes a below-threshold or unscored PR a failing status. Overrides eval.mode in .trustmodel.yml.'
    required: false
    default: ''
  framework:
    description: 'Optional framework metadata.'
    required: false
    default: ''
  detect:
    description: 'Comma-separated file-path patterns. Only paths are transmitted, never content.'
    required: false
    default: ''
  base_url:
    description: 'TrustModel gateway origin.'
    required: false
    default: 'https://api.trustmodel.ai'
  website_domain:
    description: 'Optional explicit public domain for an informational website TrustScore. Never affects PR evaluation or its gate. Blank disables scanning.'
    required: false
    default: ''
  sarif_file:
    description: 'Optional relative path (ending in .sarif) to write a SARIF 2.1.0 file for GitHub Code Scanning; upload it with github/codeql-action/upload-sarif. Blank (default) writes nothing.'
    required: false
    default: ''
outputs:
  website_domain:
    description: 'Explicit domain assessed separately from the PR.'
  website_scan_status:
    description: 'disabled, assessed, or unavailable; never a PR gate decision.'
  website_trust_score:
    description: 'Informational website score, empty when unavailable or disabled. Never a PR score.'
  status:
    description: 'skipped, not_available, passed, failed, or error.'
  mode:
    description: 'advisory or enforce: the mode this run used.'
  passed:
    description: 'True only for an explicit server-verified PR diff evaluation pass, in either mode.'
  pr_diff_evaluated:
    description: 'Whether the server actually evaluated the PR diff.'
  trust_score:
    description: 'Empty unless the server evaluated the PR diff.'
  report_url:
    description: 'Optional verified evaluation report.'
  sarif_file:
    description: 'Path of the SARIF file written this run; empty when sarif_file is off or there was no scored result to report.'

runs:
  using: 'node24'
  main: 'dist/index.js'
